- name: Service account
  ansible.builtin.user:
    name: "{{ ferrite_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ ferrite_root }}"

- name: Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ferrite_user }}"
    mode: "0750"
  loop:
    - "{{ ferrite_root }}"
    - "{{ ferrite_release }}"
    - "{{ ferrite_scratch }}"   # local NVMe; chunks never round-trip through S3

- name: Install the binary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../target/release/ferrite"
    dest: "{{ ferrite_release }}/ferrite"
    owner: "{{ ferrite_user }}"
    mode: "0755"
  notify: restart ferrite-worker

- name: Current symlink
  ansible.builtin.file:
    src: "{{ ferrite_release }}"
    dest: "{{ ferrite_root }}/current"
    state: link
  notify: restart ferrite-worker

- name: Unit file, one per CPU group
  ansible.builtin.template:
    src: ferrite-worker.service.j2
    dest: /etc/systemd/system/ferrite-worker@.service
    mode: "0644"
  notify:
    - reload systemd
    - restart ferrite-worker

- name: Drop-in directory per instance
  ansible.builtin.file:
    path: "/etc/systemd/system/ferrite-worker@{{ item }}.service.d"
    state: directory
    mode: "0755"
  loop: "{{ range(0, ferrite_cpu_groups) | list }}"

- name: Pin each instance to its own CPU group
  ansible.builtin.copy:
    dest: "/etc/systemd/system/ferrite-worker@{{ item }}.service.d/cpu.conf"
    content: |
      [Service]
      AllowedCPUs={{ item * ferrite_threads_per_group }}-{{ (item + 1) * ferrite_threads_per_group - 1 }}
    mode: "0644"
  loop: "{{ range(0, ferrite_cpu_groups) | list }}"
  notify: restart ferrite-worker

- name: Enable one worker per CPU group
  ansible.builtin.systemd_service:
    name: "ferrite-worker@{{ item }}"
    enabled: true
    state: started
  loop: "{{ range(0, ferrite_cpu_groups) | list }}"
