[package]
name = "ferrite-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The ferrite CLI: run the pipeline locally, verify output, operate the system."

[[bin]]
name = "ferrite"
path = "src/main.rs"

[features]
default = []
# Local pipeline commands need real video; operate/verify commands do not.
ffmpeg = ["ferrite-av/ffmpeg", "ferrite-worker/ffmpeg"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
ferrite-av.workspace = true
ferrite-worker.workspace = true
ferrite-telemetry.workspace = true

[lints]
workspace = true
