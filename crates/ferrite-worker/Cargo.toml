[package]
name = "ferrite-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The machines converting video: probe, mezzanine, encode, join, check, package."

[features]
default = []
# Pipeline work needs real video; the storage layer does not.
ffmpeg = ["ferrite-av/ffmpeg"]
# The machine that pulls chunks off the queue and encodes them.
temporal = [
  "ffmpeg",
  "dep:temporalio-sdk",
  "dep:temporalio-client",
  "dep:temporalio-macros",
  "dep:temporalio-common",
  "dep:temporalio-workflow",
  "dep:futures",
  "dep:url",
  "dep:clap",
  "dep:tracing-subscriber",
]

[[bin]]
name = "ferrite-worker"
path = "src/bin/ferrite-worker.rs"
required-features = ["temporal"]

[dependencies]
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
ferrite-av.workspace = true
ferrite-telemetry.workspace = true
opendal.workspace = true
thiserror.workspace = true

temporalio-sdk = { version = "=0.7.0", optional = true }
temporalio-client = { version = "=0.7.0", optional = true }
temporalio-macros = { version = "=0.7.0", optional = true }
temporalio-common = { version = "=0.7.0", optional = true }
temporalio-workflow = { version = "=0.7.0", optional = true }
futures = { version = "0.3", optional = true }
url = { version = "2", optional = true }
clap = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
ferrite-av = { workspace = true, features = ["ffmpeg"] }

[lints]
workspace = true
