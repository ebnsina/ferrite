[package]
name = "ferrite-scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Admission control: should this work start now, or wait?"

[[bin]]
name = "ferrite-scheduler"
path = "src/bin/ferrite-scheduler.rs"

[[bin]]
name = "ferrite-fake-worker"
path = "src/bin/ferrite-fake-worker.rs"
required-features = ["fake-worker"]

[features]
default = []
# The real engine. Off by default so the core crate and its tests stay light.
temporal = ["dep:temporalio-client", "dep:temporalio-common", "dep:url"]
# The fake-work worker that proves the engine without any video code.
fake-worker = ["temporal", "dep:temporalio-sdk", "dep:temporalio-macros", "dep:temporalio-workflow", "dep:futures", "dep:reqwest"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
ferrite-telemetry.workspace = true
tracing-subscriber.workspace = true

axum.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true

temporalio-client = { version = "=0.7.0", optional = true }
temporalio-common = { version = "=0.7.0", optional = true }
url = { version = "2", optional = true }
temporalio-sdk = { version = "=0.7.0", optional = true }
temporalio-macros = { version = "=0.7.0", optional = true }
temporalio-workflow = { version = "=0.7.0", optional = true }
futures = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }

[dev-dependencies]
tokio = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[lints]
workspace = true
