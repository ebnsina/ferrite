# Local dev only. Nothing here is a production topology.
# Every published port sits in a ferrite-specific block and is overridable, so
# this stack never fights another one for a default port. See .env.example.
name: ${COMPOSE_PROJECT_NAME:-ferrite}

services:
  # Two databases, not two schemas: neither can read the other's tables.
  assets-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ferrite
      POSTGRES_PASSWORD: ferrite
      POSTGRES_DB: assets_db
    ports: ["${FERRITE_ASSETS_DB_PORT:-55432}:5432"]
    volumes: ["assets-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrite -d assets_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  sched-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ferrite
      POSTGRES_PASSWORD: ferrite
      POSTGRES_DB: sched_db
    ports: ["${FERRITE_SCHED_DB_PORT:-55433}:5432"]
    volumes: ["sched-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrite -d sched_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Temporal's own store. Separate again — it holds in-flight work state.
  temporal-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes: ["temporal-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      temporal-db: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/ferrite.yaml
    ports: ["${FERRITE_TEMPORAL_PORT:-7253}:7233"]
    volumes:
      - ./deploy/temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/ferrite.yaml:ro"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.53.3
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["${FERRITE_TEMPORAL_UI_PORT:-8253}:8080"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ferrite
      MINIO_ROOT_PASSWORD: ferrite-dev-secret
    ports: ["${FERRITE_MINIO_PORT:-9020}:9000", "${FERRITE_MINIO_CONSOLE_PORT:-9021}:9001"]
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the buckets, then exits. `docker compose up` waits for it.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ferrite ferrite-dev-secret &&
      mc mb -p local/ferrite-sources local/ferrite-mezzanine local/ferrite-assets local/ferrite-outputs &&
      echo 'buckets ready'
      "

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./deploy/otel-collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["${FERRITE_OTLP_GRPC_PORT:-4327}:4317", "${FERRITE_OTLP_HTTP_PORT:-4328}:4318"]
    depends_on: [prometheus]

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["${FERRITE_PROMETHEUS_PORT:-9092}:9090"]

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: ferrite
    ports: ["${FERRITE_GRAFANA_PORT:-3021}:3000"]
    depends_on: [prometheus]

volumes:
  assets-db:
  sched-db:
  temporal-db:
  minio:
