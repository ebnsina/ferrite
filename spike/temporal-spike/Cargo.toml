[package]
name = "temporal-spike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Throwaway. Answers one question: does the Temporal Rust SDK hold 1,000 steps?"

[[bin]]
name = "temporal-spike"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true

# Pinned exactly. Pre-1.0, six releases in six months — upgrade deliberately.
temporalio-sdk    = { version = "=0.7.0", features = ["testing"] }
temporalio-client = "=0.7.0"
temporalio-macros = "=0.7.0"
temporalio-common = "=0.7.0"
temporalio-workflow = "=0.7.0"
futures = "0.3"
url = "2"

[lints.rust]
unsafe_code = "forbid"
# The activity/workflow macros generate types we do not control.
missing_debug_implementations = "allow"
